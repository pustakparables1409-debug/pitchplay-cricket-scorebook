<script>

function setSaveStatus(message){const node=document.getElementById('saveStatus');if(node)node.textContent=message}
function save(){db.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db));setSaveStatus('Auto-saved · '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}))}catch(e){setSaveStatus('Save failed — export a backup');console.error('PitchPlay save error:',e)}mirrorIndexedDB()}
function mirrorIndexedDB(){try{if(!('indexedDB'in window))return;const req=indexedDB.open('PitchPlayRecovery',1);req.onupgradeneeded=()=>req.result.createObjectStore('snapshots');req.onsuccess=()=>{const d=req.result;const tx=d.transaction('snapshots','readwrite');tx.objectStore('snapshots').put({data:clone(db),updated:db.updated},'latest');tx.oncomplete=()=>d.close()}}catch(e){}}
const $=s=>document.querySelector(s);
const activeTeams=()=>db.teams.filter(t=>!t.deleted);
const getTeam=id=>db.teams.find(t=>t.id===id);
const getPlayer=(team,id)=>team&&team.players.find(p=>p.id===id);
const activePlayers=team=>team?team.players.filter(p=>!p.deleted):[];
const currentMatch=()=>db.matches.find(m=>m.id===db.currentMatchId)||db.matches.find(m=>m.status==='live');
const innings=m=>m&&m.innings[m.currentInnings];
const color=id=>(getTeam(id)&&getTeam(id).color)||'#173d31';
function applyTheme(){document.documentElement.dataset.theme=db.theme||'green';const t=themes.find(x=>x[0]===db.theme)||themes[0];document.querySelector('meta[name="theme-color"]').content=t[2]}
function swap(inn){const t=inn.strikerId;inn.strikerId=inn.nonStrikerId;inn.nonStrikerId=t}
function blankInn(bat,bowl,target){return{battingTeamId:bat,bowlingTeamId:bowl,target:target||null,total:0,wickets:0,balls:0,batters:{},bowlers:{},fielding:{},extras:{wide:0,noBall:0,bye:0,legBye:0,penalty:0},events:[],complete:false,declared:false,strikerId:null,nonStrikerId:null,bowlerId:null,freeHit:false}}
function newMatchInn(m,index,target){const batId=index%2===0?m.teamA:m.teamB,bowlId=index%2===0?m.teamB:m.teamA;const inn=blankInn(batId,bowlId,target);const batTeam=getTeam(batId),bowlTeam=getTeam(bowlId);const batters=activePlayers(batTeam);inn.strikerId=batters[0]?.id||null;inn.nonStrikerId=batters[1]?.id||null;inn.bowlerId=activePlayers(bowlTeam)[0]?.id||null;return inn}
function createTeam(data){if(!data||!String(data.name||'').trim())throw new Error('Team name is required.');const normalizedName=String(data.name).trim();const duplicate=activeTeams().some(t=>String(t.name||'').trim().toLowerCase()===normalizedName.toLowerCase());if(duplicate&&!confirm('A team named “'+normalizedName+'” already exists. Create another anyway?'))return null;const players=String(data.players||'').split(/[\n,]/).map(s=>s.trim()).filter(Boolean).map((name,i)=>({id:uid(),name,jersey:i+1,deleted:false,role:i===0?'Captain':i===1?'Vice-Captain':i===2?'Wicketkeeper':'Player'}));const t={id:uid(),name:normalizedName,short:(String(data.short||normalizedName.slice(0,3)).trim()||normalizedName.slice(0,3)).toUpperCase().slice(0,5),color:/^#[0-9a-f]{6}$/i.test(String(data.color||''))?data.color:'#236447',players,roles:{captain:players[0]?.id||'',vice:players[1]?.id||'',keeper:players[2]?.id||''},deleted:false};db.teams.push(t);teamNotice='Team “'+t.name+'” saved. '+(activeTeams().length<2?'Add one more team below before starting a match.':'Your teams are ready. Open Match Setup to begin.');tab='teams';save();render();return t}
function makeMatch(data){
 const a=getTeam(data.teamA),b=getTeam(data.teamB);
 if(!a||!b||a.deleted||b.deleted||a.id===b.id){alert('Choose two different active teams.');return}
 if(activePlayers(a).length<2||activePlayers(b).length<2){alert('Add at least 2 active players to BOTH teams before starting a match. Open Teams & Players, add the squads, then try again.');tab='teams';render();return}
 const overs=Number(data.overs)||20,bpo=Number(data.ballsPerOver)||6,maxBowlerOvers=Number(data.maxBowlerOvers)||4;
 if(!Number.isFinite(overs)||overs<1||overs>100||![4,5,6,8].includes(bpo)||!Number.isFinite(maxBowlerOvers)||maxBowlerOvers<1){alert('Check overs, balls per over, and maximum overs per bowler.');return}
 const m={id:uid(),name:String(data.name||'').trim()||a.name+' vs '+b.name,teamA:a.id,teamB:b.id,format:data.format||'T20',overs,ballsPerOver:bpo,maxBowlerOvers,date:new Date().toISOString(),venue:data.venue||'',umpires:data.umpires||'',status:'live',innings:[],currentInnings:0,undo:[],dlsTarget:null,notes:[]};
 m.innings.push(newMatchInn(m,0,null));db.matches.unshift(m);db.currentMatchId=m.id;save();tab='score';render()
}
function getMatchById(id){return db.matches.find(m=>m.id===id)}
function snapshot(m){const inn=innings(m);if(!inn)return;m.undo=m.undo||[];m.undo.push({index:m.currentInnings,eventsLen:inn.events.length,inn:clone(Object.assign({},inn,{events:[]}))});if(m.undo.length>30)m.undo.shift()}
function ensureBat(inn,pid){if(!pid)return null;if(!inn.batters[pid]){const p=allPlayers().find(x=>x.id===pid);inn.batters[pid]={playerId:pid,name:p?p.name:'Archived player',runs:0,balls:0,fours:0,sixes:0,out:false,dismissal:'',notOut:true}}return inn.batters[pid]}
function ensureBowl(inn,pid){if(!pid)return null;if(!inn.bowlers[pid]){const p=allPlayers().find(x=>x.id===pid);inn.bowlers[pid]={playerId:pid,name:p?p.name:'Archived player',balls:0,runs:0,wickets:0,maidens:0}}return inn.bowlers[pid]}
function allPlayers(){return db.teams.flatMap(t=>t.players.map(p=>Object.assign({teamId:t.id,teamName:t.name},p)))}
function ballsText(balls,bpo){return Math.floor((balls||0)/(bpo||6))+'.'+((balls||0)%(bpo||6))}
function sr(balls,runs){return balls?((runs||0)*100/balls).toFixed(2):'0.00'}
function economy(balls,runs,bpo){return balls?(runs/(balls/(bpo||6))).toFixed(2):'0.00'}
function canContinue(m){return m.status==='live'&&!innings(m)?.complete}
function previousOverBowler(m,inn){
 if(!inn.balls||inn.balls%m.ballsPerOver!==0)return null;
 const completedOver=Math.floor(inn.balls/m.ballsPerOver)-1;
 for(let i=inn.events.length-1;i>=0;i--){const event=inn.events[i];if(!event.legal||!event.bowlerId)continue;const over=Number(String(event.over||'0.0').split('.')[0]);if(over===completedOver)return event.bowlerId}

}
function bowlerCanDeliver(m,inn){

 const used=Number(inn.bowlers[inn.bowlerId]?.balls)||0,maxOvers=Number(m.maxBowlerOvers);
 if(m.format!=='Test'&&Number.isFinite(maxOvers)&&maxOvers>0&&used>=maxOvers*m.ballsPerOver){alert('This bowler has reached the maximum overs. Choose another bowler.');return false}

 if(previous&&previous===inn.bowlerId){alert('The over is complete. Choose a different bowler before scoring the next over.');return false}

function recordRuns(run){
 const m=currentMatch(),inn=innings(m);
 if(!m||!canContinue(m))return alert('Start or continue a live match first.');

 if(!bowlerCanDeliver(m,inn))return;

 if(bw){bw.balls++;bw.runs+=run}

function recordExtra(type){
 const m=currentMatch(),inn=innings(m);
 if(!m||!canContinue(m))return alert('Start or continue a live match first.');
 if(!['wide','noBall','bye','legBye','penalty'].includes(type))return alert('Unknown extra type.');
 if(!inn.strikerId)return alert('Choose the striker before recording an extra.');
 if(type!=='penalty'&&!bowlerCanDeliver(m,inn))return;
 const b=ensureBat(inn,inn.strikerId),bw=ensureBowl(inn,inn.bowlerId);
 let additional=0,batRuns=0,legal=false;
 if(type==='wide'){
   const raw=prompt('Additional completed runs on this wide (0–6)?','0');if(raw===null)return;additional=Number(raw);
   if(!Number.isInteger(additional)||additional<0||additional>6)return alert('Enter a whole number from 0 to 6.');
 }else if(type==='noBall'){
   const raw=prompt('Runs off the bat on this no-ball (0–6)?','0');if(raw===null)return;batRuns=Number(raw);
   if(!Number.isInteger(batRuns)||batRuns<0||batRuns>6)return alert('Enter a whole number from 0 to 6.');
 }else if(type==='bye'||type==='legBye'){
   const raw=prompt(type==='bye'?'Bye runs (1–6):':'Leg-bye runs (1–6):','1');if(raw===null)return;additional=Number(raw);
   if(!Number.isInteger(additional)||additional<1||additional>6)return alert('Enter a whole number from 1 to 6.');legal=true;
 }else{
   const raw=prompt('Penalty runs to add (0–100):','5');if(raw===null)return;additional=Number(raw);
   if(!Number.isInteger(additional)||additional<0||additional>100)return alert('Enter a whole number from 0 to 100.');
 }

 const teamTotal=extraTotal+batRuns;
 snapshot(m);
 if(type==='noBall'){b.balls++;b.runs+=batRuns;if(batRuns===4)b.fours++;if(batRuns===6)b.sixes++}

 else inn.extras[type]=(inn.extras[type]||0)+extraTotal;

}
function wicketLimit(inn){const count=activePlayers(getTeam(inn.battingTeamId)).length;return count?Math.min(10,Math.max(1,count-1)):10}
function checkMaiden(m,inn){

function playerStatsCard(p){const s=metrics(p.id);return'<section class="panel"><div class="panelhead"><div><div class="scoreteam"><i class="colorball" style="background:'+esc(color(p.teamId))+'"></i><div><h2>'+esc(p.name)+'</h2><div class="sub">'+esc(p.teamName)+' · Jersey '+esc(p.jersey||'—')+'</div></div></div></div><span class="badge">'+esc(roleFor(getTeam(p.teamId),p.id)||'PLAYER')+'</span></div><div class="metricgrid" style="margin-top:13px"><div class="metric"><strong>'+s.matches+'</strong><span>MATCHES</span></div><div class="metric"><strong>'+s.batInnings+'</strong><span>BATTING INNINGS</span></div><div class="metric"><strong>'+s.runs+'</strong><span>RUNS</span></div><div class="metric"><strong>'+s.wickets+'</strong><span>WICKETS</span></div></div><div class="line"></div><h3>Batting</h3><div class="scrolltable"><table><tbody><tr><th>Balls</th><td>'+s.balls+'</td><th>SR</th><td>'+sr(s.balls,s.runs)+'</td></tr><tr><th>Average</th><td>'+(s.dismissals?(s.runs/s.dismissals).toFixed(2):'—')+'</td><th>Best</th><td>'+s.best+(s.bestNotOut?'*':'')+'</td></tr><tr><th>50s / 100s</th><td>'+s.fifties+' / '+s.hundreds+'</td><th>4s / 6s</th><td>'+s.fours+' / '+s.sixes+'</td></tr><tr><th>Not outs</th><td>'+s.notOuts+'</td><th>Ducks</th><td>'+s.ducks+'</td></tr></tbody></table></div><h3 style="margin-top:12px">Bowling</h3><div class="scrolltable"><table><tbody><tr><th>Overs</th><td>'+ballsText(s.bowlingBalls,6)+'</td><th>Runs</th><td>'+s.conceded+'</td></tr><tr><th>Average</th><td>'+(s.wickets?(s.conceded/s.wickets).toFixed(2):'—')+'</td><th>Economy</th><td>'+economy(s.bowlingBalls,s.conceded,6)+'</td></tr><tr><th>Strike rate</th><td>'+(s.wickets?(s.bowlingBalls/s.wickets).toFixed(2):'—')+'</td><th>Best</th><td>'+s.bestWickets+'/'+s.bestConceded+'</td></tr></tbody></table></div><h3 style="margin-top:12px">Fielding</h3><div class="metricgrid"><div class="metric"><strong>'+s.catches+'</strong><span>CATCHES</span></div><div class="metric"><strong>'+s.runOuts+'</strong><span>RUN OUTS</span></div><div class="metric"><strong>'+s.stumpings+'</strong><span>STUMPINGS</span></div><div class="metric"><strong>'+s.innings+'</strong><span>TEAM INNINGS</span></div></div></section>'}
function metrics(pid){
 const s={matches:0,innings:0,batInnings:0,runs:0,balls:0,dismissals:0,notOuts:0,ducks:0,fours:0,sixes:0,fifties:0,hundreds:0,best:0,bestNotOut:false,wickets:0,bowlingBalls:0,conceded:0,bestWickets:0,bestConceded:Infinity,catches:0,runOuts:0,stumpings:0};
 const seen=new Set();
 for(const m of db.matches){if(m.deleted)continue;let matchPlayed=false;
   for(const inn of m.innings){
     const b=inn.batters&&inn.batters[pid],w=inn.bowlers&&inn.bowlers[pid],f=inn.fielding&&inn.fielding[pid];let inInning=false;
     if(b&&(b.balls>0||b.runs>0||b.out)){inInning=true;s.batInnings++;s.runs+=Number(b.runs)||0;s.balls+=Number(b.balls)||0;s.fours+=Number(b.fours)||0;s.sixes+=Number(b.sixes)||0;if(b.out)s.dismissals++;else s.notOuts++;if(b.runs===0&&b.out)s.ducks++;if(b.runs>=50&&b.runs<100)s.fifties++;if(b.runs>=100)s.hundreds++;if(b.runs>s.best){s.best=b.runs;s.bestNotOut=!b.out}}
     if(w&&(w.balls>0||w.wickets>0||w.runs>0)){inInning=true;s.wickets+=Number(w.wickets)||0;s.bowlingBalls+=Number(w.balls)||0;s.conceded+=Number(w.runs)||0;if(w.wickets>s.bestWickets||(w.wickets===s.bestWickets&&w.runs<s.bestConceded)){s.bestWickets=w.wickets;s.bestConceded=w.runs}}
     if(f){const catches=Number(f.catches)||0,runOuts=Number(f.runOuts)||0,stumpings=Number(f.stumpings)||0;s.catches+=catches;s.runOuts+=runOuts;s.stumpings+=stumpings;if(catches||runOuts||stumpings)inInning=true}
     if(inInning){s.innings++;matchPlayed=true}
   }
   if(matchPlayed)seen.add(m.id)
 }
 s.matches=seen.size;if(s.bestConceded===Infinity)s.bestConceded=0;return s
}

function render(){applyTheme();const root=$('#app');try{root.innerHTML=tab==='score'?scorePage():tab==='teams'?teamsPage():tab==='matches'?matchesPage():tab==='analytics'?analyticsPage():settingsPage();document.querySelectorAll('.nav [data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}catch(err){console.error('PitchPlay render error:',err);root.innerHTML='<section class="panel"><div class="empty"><strong>We hit a data issue, not a lost scorecard.</strong>Your saved browser data has been kept. Export a backup, then refresh the app to retry.<p style="margin-top:14px"><button class="btn primary" data-action="reload-app">Refresh PitchPlay</button> <button class="btn" data-action="export">Export backup</button></p></div></section>'}}
function exportBackup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pitchplay-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importBackup(file){try{const obj=JSON.parse(await file.text());if(!obj||!Array.isArray(obj.teams)||!Array.isArray(obj.matches))throw Error('This does not look like a PitchPlay backup.');const teamIds=new Set(db.teams.map(t=>t.id));for(const t of obj.teams)if(!teamIds.has(t.id))db.teams.push(t);const matchIds=new Set(db.matches.map(m=>m.id));for(const m of obj.matches)if(!matchIds.has(m.id))db.matches.push(m);db.theme=obj.theme||db.theme;save();render();alert('Backup merged. Existing teams and matches were preserved.')}catch(e){alert('Import failed: '+e.message)}}
function deleteTeam(id){const t=getTeam(id);if(!t||!confirm('Archive team "'+t.name+'"? Older scorecards will be preserved.'))return;t.deleted=true;save();render()}

function deleteMatch(id){const m=getMatchById(id);if(!m||!confirm('Permanently delete "'+m.name+'" and its ball-by-ball history? Export a backup first if you need it.'))return;db.matches=db.matches.filter(x=>x.id!==id);if(db.currentMatchId===id)db.currentMatchId=null;save();render()}

   if(!team||team.deleted){alert('Team not found. Refresh the Teams & Players tab and try again.');return}
   if(!name){const field=form.querySelector('[name="playerName"]');if(field)field.focus();return}
   if(team.players.some(p=>!p.deleted&&String(p.name||'').trim().toLowerCase()===name.toLowerCase())){alert('That player is already in this team.');return}
   try{
     team.players.push({id:uid(),name,jersey:String(f.get('jersey')||'').trim(),deleted:false,role:'Player'});
     save();render();setSaveStatus('Player added: '+name)
   }catch(err){console.error('PitchPlay player save failed:',err);alert('Player could not be saved: '+(err&&err.message||'Please try again.'))}
   return
 }
 if(form.id==='matchForm'){
   e.preventDefault();
   const f=new FormData(form);
   if(!getTeam(f.get('teamA'))||!getTeam(f.get('teamB'))||f.get('teamA')===f.get('teamB')){alert('Choose two different teams.');return}

document.addEventListener('change',e=>{const r=e.target;if(r.matches('[data-team-color]')){const team=getTeam(r.dataset.teamColor);if(!team||team.deleted)return;const color=String(r.value||'');if(!/^#[0-9a-f]{6}$/i.test(color))return;team.color=color;const card=r.closest('.teamcard');if(card){const stripe=card.querySelector('.teamstripe'),swatch=card.querySelector('.colorball');if(stripe)stripe.style.backgroundColor=color;if(swatch)swatch.style.backgroundColor=color}save();setSaveStatus('Team colour saved: '+team.name);return}else if(r.matches('[data-role]')){const t=getTeam(r.dataset.team);if(!t.roles)t.roles={};if(r.value&&Object.keys(t.roles).some(k=>k!==r.dataset.role&&t.roles[k]===r.value)){alert('Choose a different player for each role.');render();return}t.roles[r.dataset.role]=r.value;save();render()}else if(r.matches('[data-batter]')){const m=currentMatch();if(!m)return;const inn=innings(m),role=r.dataset.batter;if(r.value&&role==='striker'&&r.value===inn.nonStrikerId){alert('Striker and non-striker must be different players.');render();return}if(r.value&&role==='nonStriker'&&r.value===inn.strikerId){alert('Striker and non-striker must be different players.');render();return}inn[role==='striker'?'strikerId':'nonStrikerId']=r.value||null;if(r.value)ensureBat(inn,r.value);save();render()}else if(r.matches('[data-bowler]')){
 const m=currentMatch(),inn=innings(m);
 if(!m||!inn||!canContinue(m)){render();return}
 if(!r.value){alert('Select a bowler to continue.');render();return}
 if(r.value===inn.bowlerId){render();return}
 if(inn.balls>0&&inn.balls%m.ballsPerOver!==0){alert('A bowler can be changed only after the over is complete.');render();return}
 const max=Number(m.maxBowlerOvers),used=Number(inn.bowlers[r.value]?.balls)||0;
 if(m.format!=='Test'&&Number.isFinite(max)&&max>0&&used>=max*m.ballsPerOver){alert('That bowler has reached the maximum overs. Choose another player.');render();return}
 const previous=previousOverBowler(m,inn);
 if(previous&&previous===r.value){alert('A bowler cannot bowl consecutive overs. Choose another player.');render();return}
 inn.bowlerId=r.value;ensureBowl(inn,r.value);save();render()
}else if(r.id==='importFile'&&r.files[0])importBackup(r.files[0]);else if(r.id==='playerSearch'){analyticsQuery=r.value;render()}});
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#teamForm')){setSaveStatus('Editing team details…')}else if(e.target.closest&&e.target.closest('.addPlayerForm')){setSaveStatus('Editing player details…')}else if(e.target.id==='playerSearch'){const pos=e.target.selectionStart;analyticsQuery=e.target.value;const val=analyticsQuery;const all=allPlayers().filter(p=>!p.deleted&& (p.name+' '+p.teamName).toLowerCase().includes(val.toLowerCase()));$('#app').innerHTML='<section class="panel"><div class="panelhead"><div><h2>Player Career Analytics</h2><div class="sub">Batting · Bowling · Catches · Fielding</div></div><input class="searchbar" id="playerSearch" value="'+esc(val)+'" placeholder="Search player or team…"></div><div class="line"></div><div class="grid two">'+(all.map(p=>playerStatsCard(p)).join('')||'<div class="empty">No players found.</div>')+'</div></section>';const inp=$('#playerSearch');inp.focus();inp.setSelectionRange(pos,pos)}else if(e.target.id==='matchSearch'){const q=e.target.value.toLowerCase();const rows=db.matches.filter(m=>!m.deleted&&(m.name+' '+teamName(m.teamA)+' '+teamName(m.teamB)).toLowerCase().includes(q));const list=$('#matchList');if(list)list.innerHTML=rows.map(m=>'<div class="matchrow"><div style="min-width:0"><div class="matchtitle">'+esc(m.name)+'</div><div class="matchmeta">'+esc(m.format)+' · '+new Date(m.date).toLocaleDateString()+' · '+esc(m.status==='live'?'Live':m.result||'Completed')+'</div><div class="sub">'+esc(teamName(m.teamA))+' vs '+esc(teamName(m.teamB))+'</div></div><div class="top-actions"><button class="btn primary small" data-action="open-match" data-id="'+m.id+'">Open</button><button class="btn danger small" data-action="delete-match" data-id="'+m.id+'">Delete</button></div></div>').join('')||'<div class="empty">No matching matches.</div>'}});

async function recover(){try{if(!('indexedDB'in window))return;const req=indexedDB.open('PitchPlayRecovery',1);req.onupgradeneeded=()=>req.result.createObjectStore('snapshots');req.onsuccess=()=>{const d=req.result;const get=d.transaction('snapshots','readonly').objectStore('snapshots').get('latest');get.onsuccess=()=>{const rec=get.result;if(rec&&rec.updated>(db.updated||0)&&confirm('A newer local recovery copy was found. Restore it?')){db=rec.data;save();render()}d.close()}}}catch(e){}}
function reportAppError(message){
 try{
   const status=document.getElementById('saveStatus');if(status)status.textContent='App error · refresh needed';
   const root=document.querySelector('#app');if(root&&!document.getElementById('runtimeError')){
     root.insertAdjacentHTML('afterbegin','<div id="runtimeError" class="runtime-error" role="alert"><strong>PitchPlay ran into an error.</strong><div>'+esc(String(message||'Unknown error'))+'</div><button class="btn small" data-action="reload-app" type="button">Refresh app</button></div>')
   }
 }catch(reportError){console.error('PitchPlay could not display its error message:',reportError)}
}
window.addEventListener('error',event=>{console.error('PitchPlay runtime error:',event.error||event.message);reportAppError(event.message||'Unexpected script error')});
window.addEventListener('unhandledrejection',event=>{console.error('PitchPlay async error:',event.reason);reportAppError(event.reason&&event.reason.message||'Unexpected async error')});
