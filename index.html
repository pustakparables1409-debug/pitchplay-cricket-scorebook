owlerstats{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0}.bowlerstats strong{display:block;font-size:18px;line-height:1.15}.bowlerstats span{display:block;font-size:10px;color:var(--muted);font-weight:800}.run-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.runbtn{border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--text);font-size:22px;font-weight:1000;min-height:60px;transition:all .15s}.runbtn:hover{background:var(--soft);border-color:var(--brand)}.runbtn.boundary{background:var(--brand);color:var(--accent);border-color:var(--brand)}.runbtn.wicket{background:#9d202b;color:white;border-color:#9d202b;font-size:14px;grid-column:span 2}.quickextras{display:flex;flex-wrap:wrap;gap:7px}.overchips{display:flex;gap:5px;flex-wrap:wrap}.chip{width:31px;height:31px;display:grid;place-items:center;border-radius:8px;background:var(--soft);font-weight:900;font-size:12px}.chip.wicket{background:#fee2e2;color:#a11}.line{height:1px;background:var(--line);margin:13px 0}.scrolltable{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{text-align:right;padding:10px;border-bottom:1px solid var(--line)}th{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;background:var(--soft)}th:first-child,td:first-child{text-align:left}tr:last-child td{border-bottom:0}.insight{padding:12px;border-radius:14px;background:var(--soft);border-left:4px solid var(--brand)}.insight strong{display:block;margin-bottom:3px}.matchrow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.matchrow:last-child{border-bottom:0}.matchtitle{font-weight:900}.matchmeta{font-size:12px;color:var(--muted)}.searchbar{max-width:360px}.hidden{display:none!important}.notice{border-radius:12px;padding:11px 13px;background:var(--soft);font-size:12px;color:var(--muted)}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:4px 7px;background:var(--soft);font-size:10px;font-weight:900;color:var(--brand)}.modalhost:not(:empty){position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:14px;background:#081b12a8}.modal{background:var(--panel);color:var(--text);width:min(460px,100%);max-height:92dvh;overflow:auto;border-radius:21px;padding:20px;box-shadow:0 25px 90px #0005}.footer{text-align:center;color:var(--muted);font-size:11px;padding:24px 8px}.theme-options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.themechoice{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);color:var(--text);font-weight:800;font-size:12px;text-align:center}.themechoice i{display:block;width:100%;height:19px;border-radius:6px;margin-bottom:7px}.themechoice.selected{border:2px solid var(--brand);background:var(--soft)}#printArea{display:none}@media(max-width:840px){.cols{grid-template-columns:1fr}.three{grid-template-columns:repeat(2,minmax(0,1fr))}.metricgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{padding:13px 12px 30px}.panel{padding:15px}.teamstripe{margin:-15px -15px 13px}}@media(max-width:540px){h1{font-size:21px}.nav{border-radius:13px}.nav button{padding:9px 11px;font-size:12px}.two,.three{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.liveplayers{grid-template-columns:1fr}.run-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.runbtn{min-height:54px}.runbtn.wicket{grid-column:span 2}.roleinputs{grid-template-columns:1fr}.score-big{font-size:36px}.theme-options{grid-template-columns:repeat(2,minmax(0,1fr))}.top-actions{width:100%}.top-actions .btn{flex:1}.status{display:none}.batter .bname{max-width:80%}.matchrow{align-items:flex-start}.searchbar{max-width:none;width:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}@media print{body{background:white!important;color:#111!important}.shell,body>*:not(#printArea),#app{display:none!important}#printArea{display:block!important;position:absolute;inset:0;padding:16px;color:#111;background:#fff;font-family:Arial,sans-serif}#printArea h1,#printArea h2,#printArea h3{font-weight:900}#printArea .prteam{font-size:14px;font-weight:900;padding:9px;color:#111!important;background:#eee!important;border-left:8px solid var(--teamcolor)}#printArea table{font-size:11px}#printArea th{font-weight:900;background:#e8e8e8!important;color:#111}#printArea td,#printArea th{padding:7px;border-bottom:1px solid #bbb}#printArea .prtotal{font-weight:1000;font-size:20px}}

<body>
<div class="shell">
<header class="topbar">
  <div class="brandmark"><div class="logo">P!</div><div><h1>PitchPlay</h1><div class="sub">Cricket Score Studio</div></div></div>
  <div class="top-actions"><span class="status"><i class="dot"></i><span id="saveStatus">Saved on this device</span></span><button class="btn soft" data-action="export">Export backup</button><button class="btn" data-action="import">Import</button><input id="importFile" type="file" accept="application/json,.json" hidden></div>
</header>
<nav class="nav" aria-label="Main navigation">
<button class="active" data-tab="score">🏏 Live Scoring</button><button data-tab="teams">👥 Teams & Players</button><button data-tab="matches">📋 Matches</button><button data-tab="analytics">📊 Player Analytics</button><button data-tab="settings">🎨 Themes & Settings</button>
</nav>
<main id="app" aria-live="polite"></main>
<div class="footer">PitchPlay · Offline-first scoring · Keep a backup of important matches</div>
</div>
<div id="modalhost" class="modalhost"></div><div id="printArea"></div>
<script>
(function(){
'use strict';
const KEY='pitchplay-cricket-v3';
const themes=[['green','Classic Green','#173d31','#d7f36b'],['blue','Royal Blue','#173f75','#83c9ff'],['brown','Dark Brown','#4a2d20','#e6bb78'],['purple','Royal Purple','#4b2875','#d2a7ff'],['teal','Ocean Teal','#075c61','#71e2d0'],['red','Crimson Red','#7c2730','#ffb2a4'],['orange','Sunset Orange','#8b421b','#ffd08a'],['black','AMOLED Black','#000000','#b7f56a']];
let db=load();let tab='score';let analyticsQuery='';
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function clone(x){return JSON.parse(JSON.stringify(x))}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.teams)&&Array.isArray(x.matches))return x}catch(e){}return{version:3,teams:[],matches:[],currentMatchId:null,theme:'green',updated:Date.now()}}
function save(){db.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('saveStatus').textContent='Auto-saved · '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}catch(e){document.getElementById('saveStatus').textContent='Storage full — export a backup'};mirrorIndexedDB()}
function mirrorIndexedDB(){try{if(!('indexedDB'in window))return;const req=indexedDB.open('PitchPlayRecovery',1);req.onupgradeneeded=()=>req.result.createObjectStore('snapshots');req.onsuccess=()=>{const d=req.result;const tx=d.transaction('snapshots','readwrite');tx.objectStore('snapshots').put({data:clone(db),updated:db.updated},'latest');tx.oncomplete=()=>d.close()}}catch(e){}}
const $=s=>document.querySelector(s);
const activeTeams=()=>db.teams.filter(t=>!t.deleted);
const getTeam=id=>db.teams.find(t=>t.id===id);
const getPlayer=(team,id)=>team&&team.players.find(p=>p.id===id);
const activePlayers=team=>team?team.players.filter(p=>!p.deleted):[];
const currentMatch=()=>db.matches.find(m=>m.id===db.currentMatchId)||db.matches.find(m=>m.status==='live');
const innings=m=>m&&m.innings[m.currentInnings];
const color=id=>(getTeam(id)&&getTeam(id).color)||'#173d31';
function applyTheme(){document.documentElement.dataset.theme=db.theme||'green';const t=themes.find(x=>x[0]===db.theme)||themes[0];document.querySelector('meta[name="theme-color"]').content=t[2]}
function swap(inn){const t=inn.strikerId;inn.strikerId=inn.nonStrikerId;inn.nonStrikerId=t}
function blankInn(bat,bowl,target){return{battingTeamId:bat,bowlingTeamId:bowl,target:target||null,total:0,wickets:0,balls:0,batters:{},bowlers:{},fielding:{},extras:{wide:0,noBall:0,bye:0,legBye:0,penalty:0},events:[],complete:false,declared:false,strikerId:null,nonStrikerId:null,bowlerId:null,freeHit:false}}
function newMatchInn(m,index,target){const batId=index%2===0?m.teamA:m.teamB,bowlId=index%2===0?m.teamB:m.teamA;const inn=blankInn(batId,bowlId,target);const batTeam=getTeam(batId),bowlTeam=getTeam(bowlId);const batters=activePlayers(batTeam);inn.strikerId=batters[0]?.id||null;inn.nonStrikerId=batters[1]?.id||null;inn.bowlerId=activePlayers(bowlTeam)[0]?.id||null;return inn}
function createTeam(data){const players=(data.players||'').split(/[\n,]/).map(s=>s.trim()).filter(Boolean).map((name,i)=>({id:uid(),name,jersey:i+1,deleted:false,role:i===0?'Captain':i===1?'Vice-Captain':i===2?'Wicketkeeper':'Player'}));const t={id:uid(),name:data.name.trim(),short:(data.short||data.name.slice(0,3)).trim().toUpperCase().slice(0,5),color:data.color||'#236447',players,roles:{captain:players[0]?.id||'',vice:players[1]?.id||'',keeper:players[2]?.id||''},deleted:false};db.teams.push(t);save();render()}
function makeMatch(data){const a=getTeam(data.teamA),b=getTeam(data.teamB);if(!a||!b||a.id===b.id)return alert('Select two different teams.');const m={id:uid(),name:data.name||a.name+' vs '+b.name,teamA:a.id,teamB:b.id,format:data.format||'T20',overs:+data.overs||20,ballsPerOver:+data.ballsPerOver||6,maxBowlerOvers:+data.maxBowlerOvers||4,date:new Date().toISOString(),venue:data.venue||'',umpires:data.umpires||'',status:'live',innings:[],currentInnings:0,undo:[],dlsTarget:null,notes:[]};m.innings.push(newMatchInn(m,0,null));db.matches.unshift(m);db.currentMatchId=m.id;save();tab='score';render()}
function getMatchById(id){return db.matches.find(m=>m.id===id)}
function snapshot(m){const inn=innings(m);if(!inn)return;m.undo=m.undo||[];m.undo.push({index:m.currentInnings,inn:clone(inn)});if(m.undo.length>50)m.undo.shift()}
function ensureBat(inn,pid){if(!pid)return null;if(!inn.batters[pid]){const p=allPlayers().find(x=>x.id===pid);inn.batters[pid]={playerId:pid,name:p?p.name:'Archived player',runs:0,balls:0,fours:0,sixes:0,out:false,dismissal:'',notOut:true}}return inn.batters[pid]}
function ensureBowl(inn,pid){if(!pid)return null;if(!inn.bowlers[pid]){const p=allPlayers().find(x=>x.id===pid);inn.bowlers[pid]={playerId:pid,name:p?p.name:'Archived player',balls:0,runs:0,wickets:0,maidens:0}}return inn.bowlers[pid]}
function allPlayers(){return db.teams.flatMap(t=>t.players.map(p=>Object.assign({teamId:t.id,teamName:t.name},p)))}
function ballsText(balls,bpo){return Math.floor((balls||0)/(bpo||6))+'.'+((balls||0)%(bpo||6))}
function sr(balls,runs){return balls?((runs||0)*100/balls).toFixed(2):'0.00'}
function economy(balls,runs,bpo){return balls?(runs/(balls/(bpo||6))).toFixed(2):'0.00'}
function canContinue(m){return m.status==='live'&&!innings(m)?.complete}
function recordRuns(run){const m=currentMatch(),inn=innings(m);if(!m||!canContinue(m))return alert('Start or continue a live match first.');if(!inn.strikerId)return alert('Choose the striker first.');snapshot(m);const b=ensureBat(inn,inn.strikerId),bw=ensureBowl(inn,inn.bowlerId);b.runs+=run;b.balls++;if(run===4)b.fours++;if(run===6)b.sixes++;inn.total+=run;inn.balls++;if(bw){bw.balls++;bw.runs+=run}inn.events.push({over:ballsText(inn.balls-1,m.ballsPerOver),runs:run,batRuns:run,total:run,legal:true,strikerId:b.playerId,strikerName:b.name,bowlerId:inn.bowlerId,bowlerName:bw&&bw.name,extra:'',wicket:null});if(run%2)swap(inn);if(inn.balls%m.ballsPerOver===0)swap(inn);afterDelivery(m,inn);save();render()}
function recordExtra(type){const m=currentMatch(),inn=innings(m);if(!m||!canContinue(m))return alert('Start or continue a live match first.');snapshot(m);const names={wide:'wide',noBall:'no ball',bye:'bye',legBye:'leg bye',penalty:'penalty'};let runs=1;if(type==='penalty')runs=+(prompt('Penalty runs to add?', '5')||0);if(!Number.isFinite(runs)||runs<0)return;const legal=type!=='wide'&&type!=='noBall';let batRuns=0;const b=ensureBat(inn,inn.strikerId),bw=ensureBowl(inn,inn.bowlerId);if(type==='noBall'&&b)b.balls++;if(type!=='wide'&&type!=='noBall'&&legal){}inn.total+=runs;inn.extras[type]=(inn.extras[type]||0)+runs;if(bw&&(type==='wide'||type==='noBall'))bw.runs+=runs;if(legal){inn.balls++;if(bw)bw.balls++}inn.events.push({over:ballsText(inn.balls?inn.balls-1:0,m.ballsPerOver),runs:0,batRuns:0,total:runs,legal,strikerId:inn.strikerId,strikerName:b&&b.name,bowlerId:inn.bowlerId,bowlerName:bw&&bw.name,extra:names[type],wicket:null});if(runs%2&&type!=='wide'&&type!=='noBall')swap(inn);if(legal&&inn.balls%m.ballsPerOver===0)swap(inn);afterDelivery(m,inn);save();render()}
function afterDelivery(m,inn){if(inn.wickets>=10){inn.complete=true}if(m.format!=='Test'&&inn.target&&inn.total>=inn.target){inn.complete=true;m.status='completed';m.result=getTeam(inn.battingTeamId).name+' won the chase'}if(m.format!=='Test'&&inn.balls>=m.overs*m.ballsPerOver)inn.complete=true}
function recordWicket(form){const m=currentMatch(),inn=innings(m);if(!m||!canContinue(m))return;const type=form.type;const outId=inn.strikerId;const b=ensureBat(inn,outId),bw=ensureBowl(inn,inn.bowlerId);snapshot(m);inn.wickets++;if(b){b.out=true;b.notOut=false;b.dismissal=type}const credited=['Bowled','Caught','LBW','Stumped','Hit wicket'].includes(type);if(credited&&bw)bw.wickets++;if(type==='Caught'&&form.fielder){const f=inn.fielding[form.fielder]||(inn.fielding[form.fielder]={catches:0,runOuts:0,stumpings:0});f.catches++}if(type==='Run out'&&form.fielder){const f=inn.fielding[form.fielder]||(inn.fielding[form.fielder]={catches:0,runOuts:0,stumpings:0});f.runOuts++}if(type==='Stumped'&&form.fielder){const f=inn.fielding[form.fielder]||(inn.fielding[form.fielder]={catches:0,runOuts:0,stumpings:0});f.stumpings++}inn.balls++;if(bw)bw.balls++;inn.events.push({over:ballsText(inn.balls-1,m.ballsPerOver),runs:0,batRuns:0,total:0,legal:true,strikerId:outId,strikerName:b&&b.name,bowlerId:inn.bowlerId,bowlerName:bw&&bw.name,extra:'',wicket:type,fielderId:form.fielder||'',fielderName:form.fielder?playerName(form.fielder):''});const next=form.next;if(next){inn.strikerId=next;ensureBat(inn,next)}else inn.strikerId=null;if(inn.balls%m.ballsPerOver===0)swap(inn);if(inn.wickets>=10)inn.complete=true;closeModal();afterDelivery(m,inn);save();render()}
function playerName(id){const p=allPlayers().find(x=>x.id===id);return p?p.name:'—'}
function openWicket(){const m=currentMatch(),inn=innings(m);if(!m||!canContinue(m))return alert('Start or continue a live match first.');const team=getTeam(inn.battingTeamId),bowl=getTeam(inn.bowlingTeamId);const next=activePlayers(team).filter(p=>p.id!==inn.strikerId&&p.id!==inn.nonStrikerId&&!inn.batters[p.id]?.out);$('#modalhost').innerHTML='<div class="modal"><div class="panelhead"><div><span class="badge">WICKET</span><h2 style="margin-top:8px">Record dismissal</h2><div class="sub">Confirm the dismissal and choose the incoming batter.</div></div><button type="button" class="btn small" data-action="close-modal">✕</button></div><form id="wicketForm" class="stack" style="margin-top:15px"><div class="field"><label>Dismissal type</label><select name="type">'+['Bowled','Caught','LBW','Run out','Stumped','Hit wicket','Retired hurt','Retired out','Obstructing the field','Timed out','Handled the ball'].map(x=>'<option>'+x+'</option>').join('')+'</select></div><div class="field"><label>Fielder (if relevant)</label><select name="fielder"><option value="">Not recorded</option>'+activePlayers(bowl).map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></div><div class="field"><label>Incoming batter</label><select name="next"><option value="">Choose later</option>'+next.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></div><div class="notice">A bowler is credited only for bowled, caught, LBW, stumped and hit-wicket dismissals.</div><button class="btn primary" type="submit">Confirm wicket</button></form></div>'}
function closeModal(){$('#modalhost').innerHTML=''}
function endInnings(declare){const m=currentMatch(),inn=innings(m);if(!m||!inn)return;if(m.format==='Test'&&declare){inn.declared=true;inn.complete=true}else inn.complete=true;inn.batters[inn.strikerId]&&(inn.batters[inn.strikerId].notOut=true);inn.batters[inn.nonStrikerId]&&(inn.batters[inn.nonStrikerId].notOut=true);save();if(!m.completedAt&&m.innings.length<(m.format==='Test'?4:2)){const index=m.innings.length;let target=null;if(m.format!=='Test'&&index===1)target=inn.total+1;if(m.format==='Test'&&index===3){const scores=m.innings.map(x=>x.total);target=scores[0]+scores[2]-scores[1]+1}m.innings.push(newMatchInn(m,index,target));m.currentInnings=index;if(target&&target<=0){m.status='completed';m.result=getTeam(m.teamA).name+' won by an innings'}else m.status='live';save();render();return}m.status='completed';m.completedAt=new Date().toISOString();const first=m.innings[0],last=inn;if(last.target&&last.total>=last.target)m.result=getTeam(last.battingTeamId).name+' won the chase';else if(m.format!=='Test'&&first.total===last.total)m.result='Match tied';else if(m.format!=='Test')m.result=getTeam(first.battingTeamId).name+' won by '+(first.total-last.total)+' runs';else m.result='Match completed';save();render()}
function reviseTarget(){const m=currentMatch(),inn=innings(m);if(!m||m.format==='Test')return alert('DLS/revised target is for limited-overs matches, not Test cricket.');const val=prompt('Enter official revised target (runs):',inn.target||'');if(val===null||val===''||!Number.isFinite(+val)||+val<1)return;inn.target=+val;m.dlsTarget=+val;save();render()}
function undo(){const m=currentMatch();if(!m||!m.undo||!m.undo.length)return alert('Nothing to undo yet.');const x=m.undo.pop();m.innings[x.index]=x.inn;m.currentInnings=x.index;if(innings(m).target&&innings(m).total<innings(m).target&&m.status==='completed')m.status='live';save();render()}
function currentResult(m){if(m.result)return m.result;const i=innings(m);if(i&&i.target)return 'Need '+Math.max(0,i.target-i.total)+' runs from '+Math.max(0,m.overs*m.ballsPerOver-i.balls)+' balls';return 'Scoring in progress'}
function scorePage(){const m=currentMatch();if(!m)return'<div class="panel"><div class="empty"><strong>No live match yet</strong>Create teams first, then start a match. No login is needed and changes auto-save on this device.<p style="margin:14px 0 0"><button class="btn primary" data-tab="teams">Create teams</button> <button class="btn" data-tab="matches">Set up match</button></p></div></div>';const inn=innings(m);if(!inn)return'';const batting=getTeam(inn.battingTeamId),bowling=getTeam(inn.bowlingTeamId);const batterStats=inn.batters;const striker=inn.strikerId?ensureBat(inn,inn.strikerId):null;const non=inn.nonStrikerId?ensureBat(inn,inn.nonStrikerId):null;const bw=inn.bowlerId?ensureBowl(inn,inn.bowlerId):null;const strikerRuns=striker?striker.runs:0,nonRuns=non?non.runs:0;const rr=inn.balls?inn.total/(inn.balls/m.ballsPerOver):0;const rem=inn.target?Math.max(0,inn.target-inn.total):0;const ballsLeft=Math.max(0,m.overs*m.ballsPerOver-inn.balls);const rrr=inn.target&&ballsLeft?(rem/(ballsLeft/m.ballsPerOver)).toFixed(2):'—';const events=inn.events.slice(-m.ballsPerOver);return'<div class="scoring"><div class="panelhead"><div><span class="badge">'+esc(m.format)+' MATCH</span><h2 style="margin-top:8px">'+esc(m.name)+'</h2><div class="sub">'+esc(m.venue||'Venue not set')+' · '+new Date(m.date).toLocaleDateString()+' · Innings '+(m.currentInnings+1)+'</div></div><div class="top-actions"><button class="btn small" data-action="undo">↶ Undo</button><button class="btn small" data-action="print">Print / PDF</button></div></div><div class="scorehero" style="--teamcolor:'+color(inn.battingTeamId)+'"><div class="tag">'+esc(batting&&batting.name||'Batting team')+' · '+(m.status==='completed'?'Match complete':inn.complete?'Innings complete':'Live score')+'</div><div class="score-big">'+inn.total+'<span style="font-size:23px"> / '+inn.wickets+'</span></div><div class="score-meta">'+ballsText(inn.balls,m.ballsPerOver)+' overs · CRR '+rr.toFixed(2)+(inn.target?' · Target '+inn.target+' · RRR '+rrr:'')+'</div><div class="line" style="background:#ffffff30"></div><div class="score-meta">'+esc(currentResult(m))+'</div></div><div class="grid cols"><section class="panel"><div class="panelhead"><div><h2>Batters at the crease</h2><div class="sub">SR = runs ÷ balls × 100</div></div><button class="btn small" data-action="swap">⇄ Swap ends</button></div><div class="liveplayers" style="margin-top:12px">'+batterCard(inn,striker,true,batting,m)+batterCard(inn,non,false,batting,m)+'</div><div class="line"></div><div class="panelhead"><div><h2>Now bowling</h2><div class="sub">Change the bowler here</div></div><span class="badge">'+esc(bowling&&bowling.short||'BOWL')+'</span></div><div class="bowlerbox" style="margin-top:10px"><div class="overline">CURRENT BOWLER</div><div style="font-size:18px;font-weight:950;margin-top:5px">'+esc(bw?bw.name:'Select bowler')+'</div>'+bowlerSelect(bowling,inn.bowlerId)+'<div class="bowlerstats"><div><strong>'+(bw?ballsText(bw.balls,m.ballsPerOver):'0.0')+'</strong><span>OVERS</span></div><div><strong>'+(bw?bw.runs:0)+'/'+(bw?bw.wickets:0)+'</strong><span>RUNS/WKTS</span></div><div><strong>'+(bw?economy(bw.balls,bw.runs,m.ballsPerOver):'0.00')+'</strong><span>ECONOMY</span></div><div><strong>'+(bw?bw.maidens:0)+'</strong><span>MAIDENS</span></div></div></div><div class="line"></div><h2>Current over</h2><div class="overchips">'+(events.length?events.map(e=>'<span class="chip '+(e.wicket?'wicket':'')+'">'+(e.wicket?'W':e.extra==='wide'?'Wd':e.extra==='no ball'?'Nb':esc(e.total))+'</span>').join(''):'<span class="sub">No balls recorded yet</span>')+'</div></section><section class="panel"><h2>Ball-by-ball scoring</h2><div class="sub" style="margin-bottom:12px">Tap a run. Wicket and extras are separate actions.</div><div class="run-grid">'+[0,1,2,3,4,5,6].map(n=>'<button class="runbtn '+((n===4||n===6)?'boundary':'')+'" data-run="'+n+'" '+(!canContinue(m)?'disabled':'')+'>'+n+'</button>').join('')+'<button class="runbtn wicket" data-action="wicket" '+(!canContinue(m)?'disabled':'')+'>✦ Record wicket</button></div><div class="line"></div><h3>Extras</h3><div class="quickextras">'+[['wide','Wide +1'],['noBall','No-ball +1'],['bye','Bye +1'],['legBye','Leg-bye +1'],['penalty','Penalty']].map(x=>'<button class="btn small" data-extra="'+x[0]+'" '+(!canContinue(m)?'disabled':'')+'>'+x[1]+'</button>').join('')+'</div><div class="line"></div><h3>Innings controls</h3><div class="stack"><button class="btn primary" data-action="end-innings" '+(!canContinue(m)?'disabled':'')+'>'+(m.format==='Test'?'End innings':'End innings')+'</button>'+(m.format==='Test'?'<button class="btn" data-action="declare" '+(!canContinue(m)?'disabled':'')+'>Declare innings</button>':'<button class="btn" data-action="dls">DLS / Revised target</button>')+'<button class="btn" data-action="print">Export scorecard PDF</button></div></section></div><div class="grid cols"><section class="panel"><h2>Full innings scorecard</h2>'+miniScorecard(inn,m)+'</section><section class="panel"><h2>Match assistant</h2>'+insights(m,inn,rr,rrr,rem,ballsLeft)+'</section></div></div>'}
function batterCard(inn,b,striker,team,m){const p=b?getPlayer(getTeam(inn.battingTeamId),b.playerId):null;const name=b?b.name:'Select batter';return'<div class="batter '+(striker?'striker':'nonstriker')+'"><div class="bname">'+esc(name)+(p&&roleFor(getTeam(inn.battingTeamId),p.id)?'<span class="rolebadge">'+roleFor(getTeam(inn.battingTeamId),p.id)+'</span>':'')+'</div><div class="bruns">'+(b?b.runs:0)+'<span style="font-size:12px;color:var(--muted);font-weight:750"> ('+(b?b.balls:0)+')</span></div><div class="bmeta">4s '+(b?b.fours:0)+' · 6s '+(b?b.sixes:0)+'</div><div class="bmeta">Strike Rate <strong>'+sr(b?b.balls:0,b?b.runs:0)+'</strong></div><select data-batter="'+(striker?'striker':'nonStriker')+'" aria-label="'+(striker?'Striker':'Non-striker')+'">'+playerOptions(getTeam(inn.battingTeamId),b&&b.playerId)+'</select></div>'}

function miniScorecard(inn,m){const bat=Object.values(inn.batters);const bowl=Object.values(inn.bowlers);return'<div class="scrolltable"><table><thead><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr></thead><tbody>'+(bat.length?bat.map(b=>'<tr><td>'+esc(b.name)+(b.out?' <span style="color:var(--danger)">('+esc(b.dismissal)+')</span>':' <span class="sub">not out</span>')+'</td><td>'+b.runs+'</td><td>'+b.balls+'</td><td>'+b.fours+'</td><td>'+b.sixes+'</td><td>'+sr(b.balls,b.runs)+'</td></tr>').join(''):'<tr><td colspan="6">No batting data recorded</td></tr>')+'<tr><td><strong>Extras</strong></td><td colspan="5">'+Object.values(inn.extras).reduce((a,b)=>a+b,0)+'</td></tr><tr><td><strong>Total</strong></td><td><strong>'+inn.total+'</strong></td><td colspan="4">'+inn.wickets+' wickets · '+ballsText(inn.balls,m.ballsPerOver)+' overs</td></tr></tbody></table></div><h3 style="margin-top:14px">Bowling</h3><div class="scrolltable"><table><thead><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>Econ</th></tr></thead><tbody>'+(bowl.length?bowl.map(b=>'<tr><td>'+esc(b.name)+'</td><td>'+ballsText(b.balls,m.ballsPerOver)+'</td><td>'+b.runs+'</td><td>'+b.wickets+'</td><td>'+economy(b.balls,b.runs,m.ballsPerOver)+'</td></tr>').join(''):'<tr><td colspan="5">No bowling data recorded</td></tr>')+'</tbody></table></div>'}
function insights(m,inn,rr,rrr,rem,left){let a,b,c;if(inn.target){a='Chase situation';b=rem+' runs needed from '+left+' balls.';c=left&&rem/left<=1?'Rotate strike and keep wickets in hand.':left&&rem/left<1.3?'Keep a boundary option ready, but protect wickets.':'Look for low-risk boundaries; avoid dot-ball pressure.'}else{a='Batting situation';b='Current run rate is '+rr.toFixed(2)+' with '+inn.wickets+' wickets down.';c=inn.wickets>=6?'Rebuild with a stable partnership.':rr<5?'Target singles and identify boundary balls.':'Keep rotating strike and preserve a hitter for the final overs.'}return'<div class="stack"><div class="insight"><strong>What’s happening</strong>'+esc(b)+'</div><div class="insight"><strong>What to do next</strong>'+esc(c)+'</div><div class="insight"><strong>What might happen</strong>'+(inn.target?'At the current required rate, the chase '+(rr<Number(rrr)?'will need acceleration':'is within the current run-rate range')+'.':'At the current run rate, the projected score is around '+Math.round(rr*m.overs)+' runs.')+' <span class="sub">Score-based heuristic, not a guarantee.</span></div></div>'}

function teamName(id){const t=getTeam(id);return t?t.name:'Archived team'}
function analyticsPage(){const list=allPlayers().filter(p=>!p.deleted).filter(p=>(p.name+' '+p.teamName).toLowerCase().includes(analyticsQuery.toLowerCase()));return'<section class="panel"><div class="panelhead"><div><h2>Player Career Analytics</h2><div class="sub">Batting · Bowling · Catches · Fielding from saved match records</div></div><input class="searchbar" id="playerSearch" value="'+esc(analyticsQuery)+'" placeholder="Search player or team…"></div><div class="line"></div><div class="grid two">'+(list.map(p=>playerStatsCard(p)).join('')||'<div class="empty"><strong>No players found</strong>Add players to a team, then score matches to build career stats.</div>')+'</div><div class="notice" style="margin-top:14px">Career numbers are calculated only from recorded deliveries and dismissals. Historical fielding events cannot be inferred if a fielder was not recorded.</div></section>'}
function playerStatsCard(p){const s=metrics(p.id);return'<section class="panel"><div class="panelhead"><div><div class="scoreteam"><i class="colorball" style="background:'+esc(color(p.teamId))+'"></i><div><h2>'+esc(p.name)+'</h2><div class="sub">'+esc(p.teamName)+' · Jersey '+esc(p.jersey||'—')+'</div></div></div></div><span class="badge">'+esc(roleFor(getTeam(p.teamId),p.id)||'PLAYER')+'</span></div><div class="metricgrid" style="margin-top:13px"><div class="metric"><strong>'+s.matches+'</strong><span>MATCHES</span></div><div class="metric"><strong>'+s.batInnings+'</strong><span>BATTING INNINGS</span></div><div class="metric"><strong>'+s.runs+'</strong><span>RUNS</span></div><div class="metric"><strong>'+s.wickets+'</strong><span>WICKETS</span></div></div><div class="line"></div><h3>Batting</h3><div class="scrolltable"><table><tbody><tr><th>Balls</th><td>'+s.balls+'</td><th>SR</th><td>'+sr(s.balls,s.runs)+'</td></tr><tr><th>Average</th><td>'+(s.dismissals?(s.runs/s.dismissals).toFixed(2):'—')+'</td><th>Best</th><td>'+s.best+(s.bestNotOut?'*':'')+'</td></tr><tr><th>50s / 100s</th><td>'+s.fifties+' / '+s.hundreds+'</td><th>4s / 6s</th><td>'+s.fours+' / '+s.sixes+'</td></tr><tr><th>Not outs</th><td>'+s.notOuts+'</td><th>Ducks</th><td>'+s.ducks+'</td></tr></tbody></table></div><h3 style="margin-top:12px">Bowling</h3><div class="scrolltable"><table><tbody><tr><th>Overs</th><td>'+ballsText(s.bowlingBalls,6)+'</td><th>Runs</th><td>'+s.conceded+'</td></tr><tr><th>Average</th><td>'+(s.wickets?(s.conceded/s.wickets).toFixed(2):'—')+'</td><th>Economy</th><td>'+economy(s.bowlingBalls,s.conceded,6)+'</td></tr><tr><th>Strike rate</th><td>'+(s.wickets?(s.bowlingBalls/s.wickets).toFixed(2):'—')+'</td><th>Best</th><td>'+s.bestWickets+'/'+s.bestConceded+'</td></tr></tbody></table></div><h3 style="margin-top:12px">Fielding</h3><div class="metricgrid"><div class="metric"><strong>'+s.catches+'</strong><span>CATCHES</span></div><div class="metric"><strong>'+s.runOuts+'</strong><span>RUN OUTS</span></div><div class="metric"><strong>'+s.stumpings+'</strong><span>STUMPINGS</span></div><div class="metric"><strong>'+s.innings+'</strong><span>TEAM INNINGS</span></div></div></section>'}
function metrics(pid){const s={matches:0,innings:0,batInnings:0,runs:0,balls:0,dismissals:0,notOuts:0,ducks:0,fours:0,sixes:0,fifties:0,hundreds:0,best:0,bestNotOut:false,wickets:0,bowlingBalls:0,conceded:0,bestWickets:0,bestConceded:Infinity,catches:0,runOuts:0,stumpings:0};const seen=new Set();for(const m of db.matches){if(m.deleted)continue;let participated=false;for(const inn of m.innings){const b=inn.batters&&inn.batters[pid];const w=inn.bowlers&&inn.bowlers[pid];const f=inn.fielding&&inn.fielding[pid];if(b){participated=true;s.batInnings++;s.runs+=b.runs;s.balls+=b.balls;s.fours+=b.fours;s.sixes+=b.sixes;if(b.out)s.dismissals++;else s.notOuts++;if(b.runs===0&&b.out)s.ducks++;if(b.runs>=50&&b.runs<100)s.fifties++;if(b.runs>=100)s.hundreds++;if(b.runs>s.best){s.best=b.runs;s.bestNotOut=!b.out}}if(w){participated=true;s.wickets+=w.wickets;s.bowlingBalls+=w.balls;s.conceded+=w.runs;if(w.wickets>s.bestWickets||(w.wickets===s.bestWickets&&w.runs<s.bestConceded)){s.bestWickets=w.wickets;s.bestConceded=w.runs}}if(f){s.catches+=f.catches||0;s.runOuts+=f.runOuts||0;s.stumpings+=f.stumpings||0;if(f.catches||f.runOuts||f.stumpings)participated=true}if(inn.battingTeamId===getPlayer(getTeam(inn.battingTeamId),pid)?.id||inn.bowlingTeamId===pid)participated=participated||false;if(participated)s.innings++}if(participated){seen.add(m.id)}}s.matches=seen.size;if(s.bestConceded===Infinity)s.bestConceded=0;return s}
function settingsPage(){return'<div class="grid cols"><section class="panel"><h2>Choose your app theme</h2><p class="sub">Classic Green stays as the default. Switch any time.</p><div class="theme-options">'+themes.map(t=>'<button class="themechoice '+(db.theme===t[0]?'selected':'')+'" data-theme="'+t[0]+'"><i style="background:'+t[2]+';border-bottom:5px solid '+t[3]+'"></i>'+t[1]+'</button>').join('')+'</div><div class="line"></div><h2>Data & backup</h2><div class="stack"><button class="btn" data-action="export">Export all teams, players and matches (JSON)</button><button class="btn" data-action="import">Import and merge backup</button><div class="notice">Local data is stored per browser/device. Export a backup regularly. Clearing browser data can remove local matches.</div></div></section><section class="panel"><h2>Device & privacy</h2><div class="stack"><div class="insight"><strong>No-login scoring</strong>Teams and matches can be created without email or OTP.</div><div class="insight"><strong>Offline support</strong>After the hosted app and cache have loaded once, supported browsers can open the app shell offline.</div><div class="insight"><strong>Cross-device sharing</strong>A public website URL opens on different devices, but their score data does not automatically sync without a shared backend.</div><div class="insight"><strong>Best compatibility</strong>Use a current Chrome, Edge, Firefox or Safari browser. Install/PWA support requires HTTPS.</div></div></section></div>'}
function render(){applyTheme();const root=$('#app');root.innerHTML=tab==='score'?scorePage():tab==='teams'?teamsPage():tab==='matches'?matchesPage():tab==='analytics'?analyticsPage():settingsPage();document.querySelectorAll('.nav [data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function exportBackup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pitchplay-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importBackup(file){try{const obj=JSON.parse(await file.text());if(!obj||!Array.isArray(obj.teams)||!Array.isArray(obj.matches))throw Error('This does not look like a PitchPlay backup.');const teamIds=new Set(db.teams.map(t=>t.id));for(const t of obj.teams)if(!teamIds.has(t.id))db.teams.push(t);const matchIds=new Set(db.matches.map(m=>m.id));for(const m of obj.matches)if(!matchIds.has(m.id))db.matches.push(m);db.theme=obj.theme||db.theme;save();render();alert('Backup merged. Existing teams and matches were preserved.')}catch(e){alert('Import failed: '+e.message)}}
function deleteTeam(id){const t=getTeam(id);if(!t||!confirm('Archive team "'+t.name+'"? Older scorecards will be preserved.'))return;t.deleted=true;save();render()}
function deletePlayer(teamId,id){const t=getTeam(teamId),p=getPlayer(t,id);if(!p||!confirm('Archive player "'+p.name+'"? Historical stats will be preserved.'))return;p.deleted=true;save();render()}
function deleteMatch(id){const m=getMatchById(id);if(!m||!confirm('Permanently delete "'+m.name+'" and its ball-by-ball history? Export a backup first if you need it.'))return;db.matches=db.matches.filter(x=>x.id!==id);if(db.currentMatchId===id)db.currentMatchId=null;save();render()}
function printScorecard(){const m=currentMatch();if(!m)return alert('No match selected.');let html='<h1>PitchPlay — Official Scorecard</h1><div style="font-weight:800;margin-bottom:14px">'+esc(m.name)+' · '+esc(m.format)+' · '+new Date(m.date).toLocaleDateString()+'<br>'+esc(m.venue||'Venue not set')+'</div>';for(let idx=0;idx<m.innings.length;idx++){const inn=m.innings[idx],t=getTeam(inn.battingTeamId);html+='<h2 class="prteam" style="--teamcolor:'+esc(color(inn.battingTeamId))+'">'+esc(teamName(inn.battingTeamId))+' — '+inn.total+'/'+inn.wickets+' ('+ballsText(inn.balls,m.ballsPerOver)+' overs)</h2>'+miniScorecard(inn,m)+'<p style="font-weight:800">Extras: '+Object.values(inn.extras).reduce((a,b)=>a+b,0)+' · '+(inn.declared?'Declared':'Innings '+(inn.complete?'complete':'in progress'))+'</p>'}html+='<h2 style="font-weight:1000;margin-top:18px">'+esc(m.result||'Match in progress')+'</h2><p style="font-size:10px;color:#555">Generated by PitchPlay Cricket Score Studio</p>';$('#printArea').innerHTML=html;window.print()}
document.addEventListener('click',e=>{const tabBtn=e.target.closest('[data-tab]');if(tabBtn){tab=tabBtn.dataset.tab;render();return}const themeBtn=e.target.closest('[data-theme]');if(themeBtn){db.theme=themeBtn.dataset.theme;save();render();return}const run=e.target.closest('[data-run]');if(run){recordRuns(+run.dataset.run);return}const extra=e.target.closest('[data-extra]');if(extra){recordExtra(extra.dataset.extra);return}const btn=e.target.closest('[data-action]');if(!btn)return;const act=btn.dataset.action,id=btn.dataset.id;if(act==='export')exportBackup();else if(act==='import')$('#importFile').click();else if(act==='delete-team')deleteTeam(id);else if(act==='delete-player')deletePlayer(btn.dataset.team,id);else if(act==='delete-match')deleteMatch(id);else if(act==='open-match'){db.currentMatchId=id;tab='score';save();render()}else if(act==='swap'){const m=currentMatch();if(m){swap(innings(m));save();render()}}else if(act==='undo')undo();else if(act==='wicket')openWicket();else if(act==='close-modal')closeModal();else if(act==='end-innings')endInnings(false);else if(act==='declare'){if(confirm('Declare this Test innings?'))endInnings(true)}else if(act==='dls')reviseTarget();else if(act==='print')printScorecard()});
document.addEventListener('submit',e=>{if(e.target.id==='teamForm'){e.preventDefault();const f=new FormData(e.target);if(!String(f.get('name')||'').trim())return;createTeam({name:f.get('name'),short:f.get('short'),color:f.get('color'),players:f.get('players')})}else if(e.target.classList.contains('addPlayerForm')){e.preventDefault();const t=getTeam(e.target.dataset.team),f=new FormData(e.target),name=String(f.get('playerName')||'').trim();if(!t||!name)return;t.players.push({id:uid(),name,jersey:f.get('jersey')||'',deleted:false,role:'Player'});save();render()}else if(e.target.id==='matchForm'){e.preventDefault();const f=new FormData(e.target);if(!getTeam(f.get('teamA'))||!getTeam(f.get('teamB'))||f.get('teamA')===f.get('teamB'))return alert('Choose two different teams.');makeMatch(Object.fromEntries(f.entries()))}else if(e.target.id==='wicketForm'){e.preventDefault();const f=new FormData(e.target);recordWicket({type:f.get('type'),fielder:f.get('fielder'),next:f.get('next')})}});
document.addEventListener('change',e=>{const r=e.target;if(r.matches('[data-role]')){const t=getTeam(r.dataset.team);if(!t.roles)t.roles={};if(r.value&&Object.keys(t.roles).some(k=>k!==r.dataset.role&&t.roles[k]===r.value)){alert('Choose a different player for each role.');render();return}t.roles[r.dataset.role]=r.value;save();render()}else if(r.matches('[data-batter]')){const m=currentMatch();if(!m)return;const inn=innings(m),role=r.dataset.batter;if(r.value&&role==='striker'&&r.value===inn.nonStrikerId){alert('Striker and non-striker must be different players.');render();return}if(r.value&&role==='nonStriker'&&r.value===inn.strikerId){alert('Striker and non-striker must be different players.');render();return}inn[role==='striker'?'strikerId':'nonStrikerId']=r.value||null;if(r.value)ensureBat(inn,r.value);save();render()}else if(r.matches('[data-bowler]')){const m=currentMatch();if(m&&r.value){innings(m).bowlerId=r.value;ensureBowl(innings(m),r.value);save();render()}}else if(r.id==='importFile'&&r.files[0])importBackup(r.files[0]);else if(r.id==='playerSearch'){analyticsQuery=r.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='playerSearch'){const pos=e.target.selectionStart;analyticsQuery=e.target.value;const val=analyticsQuery;const all=allPlayers().filter(p=>!p.deleted&& (p.name+' '+p.teamName).toLowerCase().includes(val.toLowerCase()));$('#app').innerHTML='<section class="panel"><div class="panelhead"><div><h2>Player Career Analytics</h2><div class="sub">Batting · Bowling · Catches · Fielding</div></div><input class="searchbar" id="playerSearch" value="'+esc(val)+'" placeholder="Search player or team…"></div><div class="line"></div><div class="grid two">'+(all.map(p=>playerStatsCard(p)).join('')||'<div class="empty">No players found.</div>')+'</div></section>';const inp=$('#playerSearch');inp.focus();inp.setSelectionRange(pos,pos)}else if(e.target.id==='matchSearch'){const q=e.target.value.toLowerCase();const rows=db.matches.filter(m=>!m.deleted&&(m.name+' '+teamName(m.teamA)+' '+teamName(m.teamB)).toLowerCase().includes(q));const list=$('#matchList');if(list)list.innerHTML=rows.map(m=>'<div class="matchrow"><div style="min-width:0"><div class="matchtitle">'+esc(m.name)+'</div><div class="matchmeta">'+esc(m.format)+' · '+new Date(m.date).toLocaleDateString()+' · '+esc(m.status==='live'?'Live':m.result||'Completed')+'</div><div class="sub">'+esc(teamName(m.teamA))+' vs '+esc(teamName(m.teamB))+'</div></div><div class="top-actions"><button class="btn primary small" data-action="open-match" data-id="'+m.id+'">Open</button><button class="btn danger small" data-action="delete-match" data-id="'+m.id+'">Delete</button></div></div>').join('')||'<div class="empty">No matching matches.</div>'}});
const origNewInn=newMatchInn;
async function recover(){try{if(!('indexedDB'in window))return;const req=indexedDB.open('PitchPlayRecovery',1);req.onupgradeneeded=()=>req.result.createObjectStore('snapshots');req.onsuccess=()=>{const d=req.result;const get=d.transaction('snapshots','readonly').objectStore('snapshots').get('latest');get.onsuccess=()=>{const rec=get.result;if(rec&&rec.updated>(db.updated||0)&&confirm('A newer local recovery copy was found. Restore it?')){db=rec.data;save();render()}d.close()}}}catch(e){}}
applyTheme();render();recover();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
